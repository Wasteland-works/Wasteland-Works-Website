<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Edit project - Wasteland Works</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-pending">
    <header>
        <h1>Edit project</h1>
        <nav><a href="admin.html">Admin</a><a href="projects.html">Public projects</a></nav>
    </header>

    <main>
        <section class="card">
            <h2>Project information</h2>
            <label for="editTitle">Title</label>
            <input id="editTitle" type="text" required>
            <label for="editDescription">Short description</label>
            <textarea id="editDescription"></textarea>
            <label for="editContent">Overview</label>
            <textarea id="editContent"></textarea>
            <div class="form-actions">
                <button id="saveProjectButton" type="button">Save changes</button>
                <button class="danger-button" id="deleteProjectButton" type="button">Delete project</button>
            </div>
        </section>

        <section class="card">
            <h2>Project notes</h2>
            <label for="newNote">New update</label>
            <textarea id="newNote" placeholder="What changed?"></textarea>
            <button id="addNoteButton" type="button">Add note</button>
            <div id="notesList" class="entry-list">Loading notes…</div>
        </section>

        <section class="card">
            <h2>Files and photos</h2>
            <label for="fileInput">Choose a file</label>
            <input type="file" id="fileInput">
            <button id="uploadFileButton" type="button">Upload file</button>
            <p class="muted">Photos, PDFs, audio, ZIP files, and documents are supported.</p>
            <div id="fileList" class="entry-list">Loading files…</div>
        </section>

        <p id="editorMessage" class="form-message account-message" role="status" aria-live="polite"></p>
    </main>

    <script type="module" src="auth-check.js"></script>
    <script type="module" src="edit-projects.js"></script>
</body>
</html>
