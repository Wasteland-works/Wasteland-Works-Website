<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your Wasteland Works account.">
    <title>Sign in - Wasteland Works</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="site-header"></div>
    <main class="auth-main">
        <section class="card auth-card">
            <p class="eyebrow">Member access</p>
            <h1>Welcome back</h1>
            <p class="muted">Sign in to manage your profile and access member features.</p>

            <form id="loginForm">
                <label for="email">Email address</label>
                <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>

                <label for="password">Password</label>
                <input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="Your password" required>

                <button class="button button-solid" id="loginButton" type="submit">Sign in</button>
                <button class="text-link" id="resetPassword" type="button">Forgot password?</button>
                <p class="form-message" id="message" role="status" aria-live="polite"></p>
            </form>

            <p class="auth-switch">No account yet? <a href="register.html">Create one</a></p>
        </section>
    </main>
    <div id="site-footer"></div>
    <script src="load-layout.js"></script>
    <script type="module" src="login.js"></script>
</body>
</html>
