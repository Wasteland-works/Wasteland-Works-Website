<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your Wasteland Works account.">
    <title>Create account - Wasteland Works</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="site-header"></div>
    <main class="auth-main">
        <section class="card auth-card">
            <p class="eyebrow">Join the workshop</p>
            <h1>Create account</h1>
            <p class="muted">Set up your Wasteland Works member profile.</p>

            <form id="registerForm">
                <label for="displayName">Display name</label>
                <input id="displayName" type="text" autocomplete="nickname" minlength="3" maxlength="50" placeholder="What should we call you?" required>

                <label for="email">Email address</label>
                <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>

                <label for="password">Password</label>
                <input id="password" type="password" autocomplete="new-password" minlength="6" placeholder="At least 6 characters" required>

                <label for="confirmPassword">Confirm password</label>
                <input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Repeat your password" required>

                <button class="button button-solid" id="registerButton" type="submit">Create account</button>
                <p class="form-message" id="message" role="status" aria-live="polite"></p>
            </form>

            <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
        </section>
    </main>
    <div id="site-footer"></div>
    <script src="load-layout.js"></script>
    <script type="module" src="register.js"></script>
</body>
</html>
