<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projects - Wasteland Works</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div id="site-header"></div>

    <main>

        <section class="card">

            <h1>Projects</h1>

            <p>
                Explore our current and completed projects.
            </p>

        </section>

        <section id="projectAdminTools" class="card admin-tools" hidden>
            <p class="eyebrow">Founder controls</p>
            <div class="admin-tools-heading">
                <div>
                    <h2>Add a project</h2>
                    <p>Create a project here and it will appear on this page immediately.</p>
                </div>
                <a class="button" href="admin.html">Open full admin panel</a>
            </div>

            <div class="admin-project-form">
                <label for="adminProjectTitle">Project title</label>
                <input id="adminProjectTitle" type="text" required placeholder="What are you building?">
                <label for="adminProjectDescription">Short description</label>
                <textarea id="adminProjectDescription" placeholder="A short summary for the project card"></textarea>
                <label for="adminProjectContent">Project overview</label>
                <textarea id="adminProjectContent" placeholder="Full project details"></textarea>
                <button id="adminCreateProject" class="button-solid" type="button">Add project to website</button>
                <p id="projectAdminMessage" class="form-message" role="status" aria-live="polite"></p>
            </div>
        </section>

        <div id="projectContainer">

            <section class="card">
                <h2>Loading Projects...</h2>
            </section>

        </div>

    </main>

    <div id="site-footer"></div>

    <script src="load-layout.js"></script>
    <script type="module" src="projects.js"></script>
    <script type="module" src="projects-admin.js"></script>

</body>

</html>
